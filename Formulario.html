<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario</title>

<style>
body{
    font-family: Arial, sans-serif;
    font-size: 22px;
    margin: 30px;
}

h2{
    font-size: 36px;
}

fieldset{
    padding: 20px;
    width: 80%;
    margin-bottom: 20px;
}

legend{
    font-weight: bold;
    font-size: 24px;
}

input[type="text"]{
    width: 400px;
    height: 35px;
    font-size: 20px;
}

textarea{
    width: 600px;
    height: 150px;
    font-size: 20px;
}

input[type="radio"],
input[type="checkbox"]{
    transform: scale(1.5);
    margin-right: 10px;
}

input[type="submit"],
input[type="reset"]{
    font-size: 22px;
    padding: 10px 25px;
    margin-right: 10px;
}
</style>

</head>

<body>

<h2>Formulario de Opini&oacute;n</h2>

<form action="mailto:alejandro.percru@educa.jcyl.es"
      method="post"
      enctype="text/plain">

<fieldset>
    <legend>Datos Personales</legend>

    <label for="nombre">Nombre:</label><br>
    <input id="nombre" name="nombre" type="text"><br><br>

    <label for="apellidos">Apellidos:</label><br>
    <input id="apellidos" name="apellidos" type="text"><br><br>

    <label for="calle">Calle:</label><br>
    <input id="calle" name="calle" type="text"><br><br>

    <label for="cp">C&oacute;digo Postal:</label><br>
    <input id="cp" name="cp" type="text"><br><br>

    <label for="ciudad">Ciudad:</label><br>
    <input id="ciudad" name="ciudad" type="text"><br><br>
</fieldset>

<fieldset>
    <legend>Opini&oacute;n sobre la p&aacute;gina web</legend>

    <p>&iquest;Te ha gustado la p&aacute;gina web?</p>

    <input id="si" name="gustado" value="Si" type="radio">
    <label for="si">S&iacute;</label><br><br>

    <input id="no" name="gustado" value="No" type="radio">
    <label for="no">No</label><br><br>

    <p>&iquest;Qu&eacute; apartados te han gustado m&aacute;s?</p>

    <input id="diseno" name="apartados" value="Diseno" type="checkbox">
    <label for="diseno">Dise&ntilde;o</label><br><br>

    <input id="contenido" name="apartados" value="Contenido" type="checkbox">
    <label for="contenido">Contenido</label><br><br>

    <input id="imagenes" name="apartados" value="Imagenes" type="checkbox">
    <label for="imagenes">Im&aacute;genes</label><br><br>

    <label for="comentarios">Comentarios:</label><br>
    <textarea id="comentarios" name="comentarios"></textarea>
</fieldset>

<input type="submit" value="Enviar">
<input type="reset" value="Borrar">

</form>

</body>
</html>
